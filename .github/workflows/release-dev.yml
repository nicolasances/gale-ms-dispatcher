name: Dev Release

on:
  push:
    branches: 
      - 'feature/**'
      - main


jobs:
  # This workflow contains a single job called "release"
  release:
    name: Build & Deploy to Cloud run
    environment: totoexperiments
    runs-on: ubuntu-latest

    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v4

    - id: auth
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.CICD_SERVICE_ACCOUNT }}

    - name: Setup GCloud
      uses: google-github-actions/setup-gcloud@v3
      with:
        project_id: ${{ vars.GCP_PID }}

    - name: Authenticate to Artifact Registry
      run: |
        gcloud auth configure-docker europe-west1-docker.pkg.dev


    - name: Create Environment Variables
      run: |
        export PACKAGE_VERSION=$(cat package.json | grep version | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g' | tr -d '[[:space:]]')
        export PACKAGE_NAME=$(cat package.json | grep name | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g' | tr -d '[[:space:]]')
        echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
        echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

    - name: Build Docker image
      run: |
        docker build . -t europe-west1-docker.pkg.dev/${{ vars.GCP_PID }}/${{env.PACKAGE_NAME}}/${{env.PACKAGE_NAME}}:${{env.PACKAGE_VERSION}}

    - name: Push Docker image to Dockerhub 
      run: |
        docker push europe-west1-docker.pkg.dev/${{ vars.GCP_PID }}/${{env.PACKAGE_NAME}}/${{env.PACKAGE_NAME}}:${{env.PACKAGE_VERSION}}

    - name: Deploy image
      run: | 
        gcloud run deploy ${{env.PACKAGE_NAME}} --set-env-vars "HYPERSCALER=gcp,SERVICE_BASE_URL=${{ secrets.SERVICE_BASE_URL }},GCP_PID=${{ vars.GCP_PID }}" --service-account=${{ secrets.SERVICE_ACCOUNT }} --project=${{ vars.GCP_PID }} --image=europe-west1-docker.pkg.dev/${{ vars.GCP_PID }}/${{env.PACKAGE_NAME}}/${{env.PACKAGE_NAME}}:${{env.PACKAGE_VERSION}} --platform=managed --region=europe-west1 --allow-unauthenticated